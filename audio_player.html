<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM Listening Practice App</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom style for the currently active track */
        .track-item.active {
            background-color: #dbeafe; /* Tailwind's blue-100 */
            font-weight: 600; /* Tailwind's font-semibold */
            color: #1d4ed8; /* Tailwind's blue-700 */
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Styles for correct/incorrect answers */
        .question-item.correct {
            background-color: #dcfce7; /* Green-100 */
            border-left: 4px solid #22c55e; /* Green-500 */
        }
        .question-item.incorrect {
            background-color: #fee2e2; /* Red-100 */
            border-left: 4px solid #ef4444; /* Red-500 */
        }
        .correct-answer-text {
            color: #16a34a; /* Green-600 */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl overflow-hidden mb-8">
        
        <!-- Header -->
        <div class="p-6 bg-blue-600 text-white">
            <h1 class="text-2xl font-bold">SPM LISTENING PRACTICE</h1>
            <p class="text-blue-100">British Accent</p>
            <p class="text-blue-100">Created on 2025</p>
        </div>

        <!-- Audio Player & Current Track -->
        <div class="p-6 border-b border-gray-200">
            <audio id="audio-player" controls class="w-full rounded-lg"></audio>
            <div class="mt-4">
                <p class="text-sm text-gray-500">Now Playing:</p>
                <p id="current-track-title" class="text-lg font-semibold text-gray-800 h-6">
                    Select a track to play
                </p>
            </div>
        </div>

        <!-- Playlist -->
        <div id="playlist-container" class="divide-y divide-gray-200 max-h-60 overflow-y-auto">
            <!-- Tracks will be injected here by JavaScript -->
        </div>

    </div>

    <!-- Quiz & Score -->
    <div id="quiz-section" class="bg-white rounded-xl shadow-lg w-full max-w-2xl overflow-hidden hidden">
        <div class="p-6">
            <h2 id="quiz-title" class="text-xl font-bold text-gray-800 mb-4">Listening Quiz</h2>
            <div id="quiz-container" class="space-y-6">
                <!-- Quiz questions will be injected here -->
            </div>
            <div id="score-container" class="mt-6 text-center"></div>
            <button id="check-answers-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors mt-6">
                Check Answers
            </button>
        </div>
    </div>


    <script>
    // --- This wrapper is important for Google Apps Script ---
    document.addEventListener('DOMContentLoaded', function() {
    
        // --- 1. Define Audio Tracks with Quiz Data ---

        const audioTracks = [

                    { q: "9. What has the boy already done about the theft?", options: ["He has already reported it to the police.", "He has checked the insurance details.", "He has not reported it yet."], answer: "A" },
                    { q: "10. What is the father going to check?", options: ["The CCTV footage himself.", "The school's security policy.", "The insurance for the phone."], answer: "C" }
                ]
            },
            {
                title: "4. Favourite Things",
                url: "https://learnenglishteens.britishcouncil.org/sites/teens/files/2024-09/B1_favourite_things.mp3", // Note: This URL is duplicated, as in original file
                questions: [
                    { q: "1. Why does the boy's mother say he is 'addicted' to his tablet?", options: ["He uses it for college work.", "He uses it almost all the time.", "He watches films in bed."], answer: "B" },
                    { q: "2. When is the boy NOT allowed to use his tablet?", options: ["At breakfast time.", "When he is in bed.", "During dinner time."], answer: "C" },
                    { q: "3. How is the girl's cat different from some other cats?", options: ["It is very independent.", "It is very affectionate.", "It is very beautiful."], answer: "B" },
                    { q: "4. What does the cat do when the girl comes home?", options: ["It goes to sleep on the sofa.", "It makes a lot of noise and purrs.", "It hardly talks to her."], answer: "B" },
                    { q: "5. What was the main problem the boy had before getting his scooter?", options: ["Finding a place to park.", "The long walks to and from the metro.", "The rain making the roads slippery."], answer: "B" },
                    { q: "6. What is one potential danger the boy mentions about riding his scooter?", options: ["The metro is often too crowded.", "Drivers sometimes cannot see him.", "The helmet does not fit properly."], answer: "B" },
                    { q: "7. Why does the girl need to use her sewing machine?", options: ["To design new clothes for her course.", "To make second-hand clothes fit her.", "To start her own business immediately."], answer: "B" },
                    { q: "8. What is the girl's attitude towards a future alterations business?", options: ["She would be disappointed.", "She thinks it is not creative.", "She would not mind it."], answer: "C" },
                    { q: "9. How did the boy first become interested in cooking?", options: ["By attending a beginner's class.", "By watching a TV programme.", "By cooking for his friends."], answer: "B" },
                    { q: "10. How does the boy manage the cost of his cooking hobby?", options: ["He uses less expensive ingredients.", "His friends help pay for the food.", "He cooks for fewer people now."], answer: "B" }
                ]
            },
            {
                title: "5. Important People",
                url: "https://learnenglishteens.britishcouncil.org/sites/teens/files/2024-09/B1_important_people.mp3",
                questions: [
                    { q: "1. What did the neighbour often do for the girl and her sister when they were little?", options: ["She drove them to school.", "She told them stories from her past.", "She taught them how to bake cakes."], answer: "B" },

                    { q: "6. Why does the girl think it is good that she and her friend are good at different subjects?", options: ["They don't have to compete with each other.", "They can help each other with homework.", "They can study in different cities."], answer: "B" },
                    { q: "7. Why was the boy so excited when his friend moved onto the street?", options: ["He was the only other boy in the neighbourhood.", "His new friend had lots of interesting equipment.", "They were both starting at the same new school."], answer: "A" },
                    { q: "8. Which hobby do the two boys NOT mention doing together?", options: ["Making model aeroplanes.", "Playing football.", "Riding bicycles."], answer: "C" },
                    { q: "9. What is the current state of the boys' friendship?", options: ["They are still very close friends.", "They have lost contact completely.", "They are connected online but not close."], answer: "C" },
                    { q: "10. How does the girl feel about the length of her relationship with her boyfriend?", options: ["She thinks eighteen months is a very long time.", "She agrees that it is not a very long time.", "She wishes it had been longer."], answer: "B" }
                ]
            },
            {
                title: "6. Llamas",
                url: "https://learnenglishteens.britishcouncil.org/sites/teens/files/2024-09/B1_llamas.mp3",
                questions: [
                    { q: "1. All of the four South American animals mentioned are related to which other animal", options: ["Donkeys", "Camels", "Horses"], answer: "B" },

                    { q: "3. The boy says that Skyfall is different from other James Bond films because:", options: ["It has more action.", "The story is more important.", "Judi Dench does not appear in it."], answer: "B" },
                    { q: "4. Which aspect of the film Skyfall made the main character, James Bond, seem more human and realistic to the speaker?", options: ["His advanced technology.", "The fact that he seemed older.", "His great action sequences."], answer: "B" },
                    { q: "5. The girl says the story of Pride and Prejudice is mainly about:", options: ["People being too proud and prejudiced.", "How quickly people fall in love.", "How we often misjudge other people."], answer: "C" },
                    { q: "6. What does the girl admit might have helped Elizabeth fall in love with Mr Darcy?", options: ["His kindness to her family.", "The large size of his house.", "His excellent manners."], answer: "B" },
                    { q: "7. What did the boy do after he saw the film The Matrix?", options: ["He read the book by Jane Austen.", "He contacted the actress who played Trinity.", "He said he would recommend the book."], answer: "C" },
                    { q: "8. What does the character Morpheus explain to Neo in the film The Matrix?", options: ["The world he believes is real is actually not real.", "He must learn to use his hacking skills to fight evil machines.", "He has been chosen to lead the human race."], answer: "A" },
                    { q: "9. The girl prefers which version of the film Let the Right One In?", options: ["The more modern American version.", "The original Swedish version.", "The version that is less scary."], answer: "B" },
                    { q: "10. Which words does the girl use to describe the original version of Let the Right One In?", options: ["Scary and romantic.", "Sentimental and violent.", "Unsentimental and scary."], answer: "C" }
                ]
            },
            {
                title: "8. Organising Your Time",
                url: "https://learnenglishteens.britishcouncil.org/sites/teens/files/2024-08/B1_Organising_your_time.mp3",
                questions: [
                    { q: "1. The host says the Pomodoro Technique was named after", options: ["a clock in the school", "a tomato-shaped kitchen timer", "a type of Italian pasta"], answer: "B" },
                    { q: "2. Peter uses the Pomodoro Technique mainly for", options: ["studying", "playing games", "cooking"], answer: "A" },
                    { q: "3. According to Peter, the technique is", options: ["complicated to follow", "expensive to use", "simple to follow"], answer: "C" },
                    { q: "4. The technique involves dividing work into", options: ["long study sessions without breaks", "separate tasks and timed work periods", "group discussions and research tasks"], answer: "B" },
                    { q: "5. One 'pomodoro' equals", options: ["10 minutes of work", "25 minutes of work", "45 minutes of work"], answer: "B" },
                    { q: "6. After each pomodoro session, you should", options: ["take a break for 3 to 5 minutes", "relax for one hour", "switch tasks immediately without stopping"], answer: "A" },
                    { q: "7. To avoid distraction, Peter suggests using", options: ["a phone timer", "a kitchen timer", "a computer alarm"], answer: "B" },
                    { q: "8. Peter recommends switching off", options: ["the computer", "the lights", "the phone while studying"], answer: "C" },
                    { q: "9. After four or five short breaks, you can", options: ["stop studying completely", "take a longer break", "skip breaks altogether"], answer: "B" },

                ]
            },

                    { q: "2. The activities offered in the rooms include", options: ["chess and meditation", "yoga, tai chi, Pilates and Zumba", "football and basketball"], answer: "B" },

                    { q: "7. The gym in is described as", options: ["small and busy", "enormous with many machines", "old and in need of repair"], answer: "C" },

                    { q: "5. Canyoning involves", options: ["swimming in the sea", "jumping and moving along a river canyon using ropes", "climbing cliffs without equipment"], answer: "B" },
                    { q: "6. The girl thinks the boy's activities sound", options: ["exciting", "too easy", "too difficult"], answer: "C" },
                    { q: "7. Zip-wiring means", options: ["sliding along a wire through the air", "riding a bike down a mountain", "swimming under waterfalls"], answer: "A" },
                    { q: "8. The girl's weekend plan is to go to", options: ["London", "Paris", "Rome"], answer: "B" },
                    { q: "9. The girl is especially excited about", options: ["visiting art galleries and museums", "going camping outdoors", "watching extreme sports"], answer: "A" },
                    { q: "10. The girl will be in Paris for", options: ["two days", "three days", "four days"], answer: "C" }
                ]
            }
        ];

        // --- 2. Get DOM Elements ---
        const audioPlayer = document.getElementById('audio-player');
        const playlistContainer = document.getElementById('playlist-container');
        const currentTrackTitle = document.getElementById('current-track-title');
        const quizSection = document.getElementById('quiz-section');
        const quizContainer = document.getElementById('quiz-container');
        const quizTitle = document.getElementById('quiz-title');
        const scoreContainer = document.getElementById('score-container');
        const checkAnswersBtn = document.getElementById('check-answers-btn');

        let currentTrackIndex = -1; // To keep track of which quiz is active

        // --- 3. Build Playlist UI ---
        audioTracks.forEach((track, index) => {
            const trackElement = document.createElement('div');
            trackElement.className = "track-item p-4 cursor-pointer hover:bg-gray-100 transition-colors duration-150 flex items-center space-x-3";
            trackElement.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-12c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z" />
                </svg>
                <span class="text-gray-700">${track.title}</span>
            `;

            trackElement.addEventListener('click', () => {
                selectTrack(index, trackElement);
            });

            playlistContainer.appendChild(trackElement);
        });

        // --- 4. Select Track Function ---
        function selectTrack(index, clickedElement) {
            currentTrackIndex = index;
            const track = audioTracks[index];

            // Set audio source and play
            audioPlayer.src = track.url;
            audioPlayer.play().catch(error => console.error("Audio playback failed:", error));

            // Update current track title
            currentTrackTitle.textContent = track.title;

            // Update active class in playlist
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('active');
            });
            clickedElement.classList.add('active');

            // Display the quiz
            displayQuiz(index);
        }

        // --- 5. Display Quiz Function ---
        function displayQuiz(index) {
            const track = audioTracks[index];
            quizContainer.innerHTML = ""; // Clear previous quiz
            scoreContainer.innerHTML = ""; // Clear previous score
            quizTitle.textContent = `Quiz: ${track.title}`;

            track.questions.forEach((question, qIndex) => {
                const questionElement = document.createElement('div');
                questionElement.className = 'question-item p-4 rounded-lg border border-gray-200';
                questionElement.id = `q-item-${qIndex}`;

                let optionsHtml = `<p class="font-semibold text-gray-700 mb-3">${question.q}</p>`;
                optionsHtml += `<div class="space-y-2">`;
                const optionLetters = ['A', 'B', 'C'];

                question.options.forEach((option, oIndex) => {
                    const optionId = `q${qIndex}-o${oIndex}`;
                    optionsHtml += `
                        <label for="${optionId}" class="flex items-center p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                            <input type="radio" id="${optionId}" name="q${qIndex}" value="${optionLetters[oIndex]}" class="mr-3 text-blue-600 focus:ring-blue-500">
                            <span class="text-gray-700"><span class="font-bold">${optionLetters[oIndex]}.</span> ${option}</span>
                        </label>
                    `;
                });
                optionsHtml += `</div>`;
                optionsHtml += `<div id="result-q${qIndex}" class="mt-2 text-sm"></div>`; // For showing correct/incorrect
                questionElement.innerHTML = optionsHtml;
                quizContainer.appendChild(questionElement);
            });

            checkAnswersBtn.disabled = false;
            quizSection.classList.remove('hidden');
        }

        // --- 6. Check Answers Function ---
        checkAnswersBtn.addEventListener('click', () => {
            if (currentTrackIndex === -1) return;

            const track = audioTracks[currentTrackIndex];
            let score = 0;
            const total = track.questions.length;

            track.questions.forEach((question, qIndex) => {
                const questionItem = document.getElementById(`q-item-${qIndex}`);
                const resultText = document.getElementById(`result-q${qIndex}`);
                const selectedOption = document.querySelector(`input[name="q${qIndex}"]:checked`);
                
                // Disable all radios for this question
                document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(radio => {
                    radio.disabled = true;
                });

                if (selectedOption) {
                    if (selectedOption.value === question.answer) {
                        score++;
                        questionItem.classList.add('correct');
                        questionItem.classList.remove('incorrect');
                        resultText.innerHTML = "";
                    } else {
                        questionItem.classList.add('incorrect');
                        questionItem.classList.remove('correct');
                        const correctOption = question.options[ ['A', 'B', 'C'].indexOf(question.answer) ];
                        resultText.innerHTML = `<span class="correct-answer-text">Correct answer: ${question.answer}. ${correctOption}</span>`;
                    }
                } else {
                    // No answer selected
                    questionItem.classList.add('incorrect');
                    questionItem.classList.remove('correct');
                    const correctOption = question.options[ ['A', 'B', 'C'].indexOf(question.answer) ];
                    resultText.innerHTML = `<span class="correct-answer-text">No answer selected. Correct answer: ${question.answer}. ${correctOption}</span>`;
                }
            });

            // Display final score
            scoreContainer.innerHTML = `
                <h3 class="text-2xl font-bold">Your Score: ${score} / ${total}</h3>
            `;
            checkAnswersBtn.disabled = true; // Prevent re-checking
        });

        // --- 7. Update track on end ---
        audioPlayer.addEventListener('ended', () => {
            currentTrackTitle.textContent = "Track finished. Select another.";
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('active');
            });
        });

    }); // --- End of the DOMContentLoaded wrapper ---
    </script>
</body>
</html>
